[help]
English=A music player drawn as a cassette in a closed player. Each folder in MUSIC on your SD card is a tape in a box. L1 REW, L2 STOP/EJECT, R2 PLAY/PAUSE, R1 FF; tap REW/FF or D-pad left/right to skip a song, hold REW/FF to wind faster. Switch off before swapping SD cards.
