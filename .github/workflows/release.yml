# Builds the .muxapp and attaches it to a GitHub release. Runs when a v* tag is
# pushed, or by hand from the Actions tab with a version (the tag is created then).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q luajit
          luajit tests/run.lua

      - name: Pick version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: scripts/package.sh "${{ steps.version.outputs.version }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Retro Cassette ${{ steps.version.outputs.version }}
          files: dist/*.muxapp
          body: |
            For muOS 2606 (Andromeda). Copy the `.muxapp` to the `ARCHIVE` folder at the top of
            your SD card (`SD1/ARCHIVE/`) and install it with Applications → Archive Manager.
            It uses the LÖVE runtime that muOS ships with 2048 Plus, so nothing else needs installing.
            Switch the device off before taking an SD card out to add music, or restart it afterwards.
