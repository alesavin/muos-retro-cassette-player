# Builds the .muxapp and attaches it to a GitHub release. Runs when a v* tag is
# pushed, or by hand from the Actions tab with a version (the tag is created then).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q luajit
          luajit tests/run.lua

      - name: Pick version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: scripts/package.sh "${{ steps.version.outputs.version }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Retro Cassette ${{ steps.version.outputs.version }}
          files: dist/*.muxapp
          body: |
            Install: copy the `.muxapp` to your device and install it with muOS's Archive Manager,
            or unzip it and copy the `RetroCassette` folder to `/mnt/mmc/MUOS/application/`.
            The app needs a LÖVE runtime; see the README.
